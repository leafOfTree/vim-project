name: vim-project test
on: [push, pull_request]

jobs:
  # Headless regression tests (test/run.sh) with both editors
  Test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        editor: [vim, nvim]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install vim
        if: matrix.editor == 'vim'
        run: |
          sudo apt-get update
          sudo apt-get -y install vim
          vim --version | head -1

      - name: Install neovim
        if: matrix.editor == 'nvim'
        run: |
          sudo add-apt-repository ppa:neovim-ppa/stable -y
          sudo apt-get update
          sudo apt-get -y install neovim
          nvim --version | head -1

      - name: Run tests
        run: bash test/run.sh ${{ matrix.editor }}

  # vint lint of plugin/ and autoload/. Warnings are reported but do not
  # fail the build yet; errors do.
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install vint
        # vint still imports pkg_resources, which setuptools >= 81 removed
        run: pip install "setuptools<81" vim-vint

      - name: vint (warnings, informational)
        continue-on-error: true
        run: vint --warning plugin autoload

      - name: vint (errors, must pass)
        run: vint --error plugin autoload

  # Original end-to-end check driven by leafOfTree/vim-test
  Basic-Test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install vim and neovim
        run: |
          sudo add-apt-repository ppa:neovim-ppa/stable -y
          sudo apt-get update
          sudo apt-get -y install vim neovim

      - name: Clone vim-test
        run: |
          git clone https://github.com/leafOfTree/vim-test ../vim-test --depth=1

      - name: Run test
        run: |
          bash ../vim-test/start.sh project vim-project basic
