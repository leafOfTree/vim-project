name: vim-project test
on: [push, pull_request]

jobs:
  # Headless regression tests (test/run.sh) with both editors
  # Each editor runs with only the system tools (grep, find: the fallbacks
  # are tested) and with rg, ag and fd installed
  Test:
    name: Test (${{ matrix.editor }}, ${{ matrix.tools }} tools)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        editor: [vim, nvim]
        tools: [system, all]
    env:
      VIM_PROJECT_TEST_TOOLS: ${{ matrix.tools }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install vim
        if: matrix.editor == 'vim'
        run: |
          sudo apt-get update
          sudo apt-get -y install vim
          vim --version | head -1

      # The PPA build is too old for the tests (its getscriptinfo() takes no
      # arguments): use a pinned release
      - name: Install neovim
        if: matrix.editor == 'nvim'
        run: |
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz \
            | sudo tar -xz -C /opt
          echo /opt/nvim-linux-x86_64/bin >> "$GITHUB_PATH"

      - name: Install rg, ag and fd
        if: matrix.tools == 'all'
        run: |
          sudo apt-get update
          sudo apt-get -y install ripgrep silversearcher-ag fd-find
          # Debian names the fd binary fdfind
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: Show versions
        run: |
          ${{ matrix.editor }} --version | head -1
          git --version
          for program in rg ag grep fd find; do
            command -v "$program" || echo "$program: not installed"
          done

      - name: Run tests
        run: bash test/run.sh ${{ matrix.editor }}

      # Time budgets of the code run on every key typed in a list
      - name: Performance budgets
        env:
          VIM_PROJECT_TEST_CASES: perf
          VIM_PROJECT_PERF_REPORT: perf-report.txt
        run: bash test/run.sh ${{ matrix.editor }}

      - name: Performance report
        if: always()
        run: cat perf-report.txt || true

  # The oldest supported versions: Vim 8.2.3591 adds the WinClosed event,
  # Neovim 0.5.0 ignores jobstart() 'stdin' so rg reads the pipe forever
  Oldest:
    name: Test (${{ matrix.editor }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - editor: vim
            version: v8.2.3591
          - editor: nvim
            version: v0.5.1
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Cache vim build
        if: matrix.editor == 'vim'
        id: cache-vim
        uses: actions/cache@v4
        with:
          path: ~/vim
          key: vim-${{ matrix.version }}

      - name: Build vim
        if: matrix.editor == 'vim' && steps.cache-vim.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get -y install libncurses-dev
          git clone --depth 1 --branch ${{ matrix.version }} https://github.com/vim/vim /tmp/vim-src
          cd /tmp/vim-src
          # Old code with newer gcc: keep implicit declarations as warnings
          CFLAGS="-O2 -Wno-error=implicit-function-declaration" \
            ./configure --prefix="$HOME/vim" --with-features=huge --enable-gui=no --without-x
          make -j"$(nproc)"
          make install

      - name: Install vim
        if: matrix.editor == 'vim'
        run: echo "$HOME/vim/bin" >> "$GITHUB_PATH"

      - name: Install neovim
        if: matrix.editor == 'nvim'
        run: |
          curl -fsSL https://github.com/neovim/neovim/releases/download/${{ matrix.version }}/nvim-linux64.tar.gz \
            | sudo tar -xz -C /opt
          echo /opt/nvim-linux64/bin >> "$GITHUB_PATH"

      - name: Show versions
        run: ${{ matrix.editor }} --version | head -2

      - name: Run tests
        run: bash test/run.sh ${{ matrix.editor }}

  # vint lint of plugin/ and autoload/. Warnings are reported but do not
  # fail the build yet; errors do.
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install vint
        # vint still imports pkg_resources, which setuptools >= 81 removed
        run: pip install "setuptools<81" vim-vint

      - name: vint (warnings, informational)
        continue-on-error: true
        run: vint --warning plugin autoload

      - name: vint (errors, must pass)
        run: vint --error plugin autoload

  # Original end-to-end check driven by leafOfTree/vim-test
  Basic-Test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      # The neovim PPA has no build for every Ubuntu ubuntu-latest moves to:
      # use the pinned release like the Test job
      - name: Install vim and neovim
        run: |
          sudo apt-get update
          sudo apt-get -y install vim
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz \
            | sudo tar -xz -C /opt
          echo /opt/nvim-linux-x86_64/bin >> "$GITHUB_PATH"

      - name: Clone vim-test
        run: |
          git clone https://github.com/leafOfTree/vim-test ../vim-test --depth=1

      - name: Run test
        run: |
          bash ../vim-test/start.sh project vim-project basic
