<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <!-- First frames of each demo, so a reader sees where it starts again.
       Same size as settings.tape. render.sh replaces TITLE with the
       "# Title:" of the tape, and OFFSET to center the logo and text. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D98C"/>
      <stop offset="1" stop-color="#05804A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="#1e1e2e"/>
  <g transform="translate(OFFSET 0)">
    <g transform="translate(0 285) scale(0.5859375)">
      <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#tile)"/>
      <path d="M48 82a16 16 0 0 1 16-16h33a14 14 0 0 1 10 4l12 12h73a16 16 0 0 1 16 16v10H48z" fill="#C9F7DE"/>
      <rect x="48" y="96" width="160" height="100" rx="16" fill="#fff"/>
      <path d="M100 124l28 40 28-40" fill="none" stroke="#06904F" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
      <text x="186" y="350" font-size="48" font-weight="bold" fill="#cdd6f4">vim-project</text>
      <text x="187" y="400" font-size="38" fill="#a6adc8">TITLE</text>
    </g>
  </g>
</svg>
